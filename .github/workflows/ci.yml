name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test:unit

  api-tests:
    name: API Tests (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run API tests
        run: npm run test:api:ci

      - name: Upload API artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-results-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: |
            allure-results/
            reports/
          if-no-files-found: ignore

  ui-tests:
    name: UI Tests (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps

      - name: Install Playwright browsers (macOS)
        if: runner.os != 'Linux'
        run: npx playwright install

      - name: Run UI tests
        run: npm run test:ui:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: |
            playwright-report/
            test-results/
            allure-results/
          if-no-files-found: ignore

    deploy-report:
    name: Deploy Allure Report
    runs-on: ubuntu-latest
    needs: [ui-tests, api-tests]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Merge Allure results
        run: |
          mkdir merged-results
          find all-results -name "*.json" -exec cp {} merged-results/ \;

      - name: Generate Allure report
        run: |
          npx allure generate merged-results --clean -o allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate fresh Playwright HTML report
        run: npm run test:ui:ci

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./playwright-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Telegram Notify
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, ui-tests, deploy-report]
    if: always()

    steps:
      - name: Send Telegram message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            CI/CD завершён
            Репозиторий: ${{ github.repository }}
            Ветка: ${{ github.ref_name }}
            Unit: ${{ needs.unit-tests.result }}
            API: ${{ needs.api-tests.result }}
            UI: ${{ needs.ui-tests.result }}
            Report: https://Pipi6901.github.io/lab6-ci-cd-final/